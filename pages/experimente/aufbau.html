<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rollenspieltag - Aufbau-Experimente</title>
  <link rel="stylesheet" href="../../styles/style.css?v=84">
  <link rel="stylesheet" href="../../styles/experimente/layouts.css?v=84">
</head>
<body>

  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner" aria-hidden="true"></div>
    <p>Dashboard wird geladen …</p>
  </div>

  <header class="lx-topbar">
    <div class="lx-brand">
      <img src="../../Images/Default/gc_logo.png" alt="Logo des Veranstalters">
      <div>
        <h1 id="event-title"> </h1>
        <p><span id="event-date"></span> &middot; <span id="event-location"></span></p>
      </div>
    </div>
    <nav class="lx-switch" id="lx-switch"></nav>
  </header>

  <main id="lx-root"></main>

  <footer class="site-footer">
    <a href="index.html">&larr; Zurück zu den Experimenten</a>
  </footer>

  <!-- Pop-up mit Abenteuer-Details (identisch zur Kachelansicht in index.html) -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-system">
      <button class="modal-close" id="modal-close" aria-label="Schließen">&times;</button>
      <div id="modal-image-slot">
        <div id="modal-image-inner"></div>
        <div class="modal-image-overlay">
          <div class="modal-header-row">
            <h2 class="modal-system" id="modal-system"></h2>
            <img class="modal-language hidden" id="modal-language" alt="Englisch">
          </div>
          <p class="modal-title" id="modal-title"></p>
        </div>
      </div>
      <div class="modal-content">
        <div class="modal-stats">
          <div class="stat" id="modal-time"></div>
          <div class="stat" id="modal-players"></div>
        </div>
        <div class="fill-bar hidden" id="modal-fill-bar"></div>
        <p class="modal-section-label">
          <span id="modal-description-label">Beschreibung:</span>
          <span class="content-warning-flag hidden" id="modal-content-warning-flag"></span>
        </p>
        <p class="modal-description" id="modal-description"></p>
        <p class="modal-gm" id="modal-gm"></p>
      </div>
    </div>
  </div>

  <script>const ASSET_BASE = "../../";</script>
  <script src="../../source/data.js?v=84"></script>
  <script src="../../csv-link.js"></script>
  <script src="../../source/sheet-loader.js?v=84"></script>
  <script src="../../source/image-resolver.js?v=84"></script>
  <script src="../../source/shared.js?v=84"></script>
  <script src="../../source/experimente-layouts.js?v=84"></script>
</body>
</html>
